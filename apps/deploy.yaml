apiVersion: v1
kind: Namespace
metadata:
  name: fluxfeed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxfeed-config
  namespace: fluxfeed
data:
  api-config.yaml: |
    environment: "development"
    port: 8080
    jwt:
      secret: ""
      access_ttl: "15m"

    internal:
      token: ""

    database:
      host: "mysql"
      port: 3306
      user: ""
      password: ""
      name: "FluxFeed"
      tls: "false"

    redis:
      addr: "redis:6379"
      password: ""
      db: 0

    kafka:
      brokers: []

    rabbitmq:
      url: ""
      interaction_exchange: "fluxfeed.interaction"
      action_changed_queue: "fluxfeed.interaction.action_changed"
      action_changed_routing: "interaction.action_changed"
      video_exchange: "fluxfeed.video"
      video_published_queue: "fluxfeed.video.published"
      video_embedding_queue: "fluxfeed.video.embedding"
      video_published_routing: "video.published"
      exposure_exchange: "fluxfeed.exposure"
      view_event_recorded_queue: "fluxfeed.exposure.view_event_recorded"
      view_event_recorded_routing: "exposure.view_event_recorded"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: fluxfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: fluxfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: fluxfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-uploads
  namespace: fluxfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: FluxFeed
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: fluxfeed
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: redis-password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fluxfeed
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: rabbitmq-password
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fluxfeed
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: fluxfeed-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FLUXFEED_ENV
              value: development
            - name: FLUXFEED_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: jwt-secret
            - name: FLUXFEED_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: internal-token
            - name: FLUXFEED_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-user
            - name: FLUXFEED_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-password
            - name: FLUXFEED_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: redis-password
            - name: FLUXFEED_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: rabbitmq-url
          volumeMounts:
            - name: api-config
              mountPath: /app/configs/config.yaml
              subPath: api-config.yaml
              readOnly: true
            - name: api-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: api-config
          configMap:
            name: fluxfeed-config
            items:
              - key: api-config.yaml
                path: api-config.yaml
        - name: api-uploads
          persistentVolumeClaim:
            claimName: api-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fluxfeed
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: fluxfeed-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - ./fluxfeed-worker
          env:
            - name: FLUXFEED_ENV
              value: development
            - name: FLUXFEED_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: jwt-secret
            - name: FLUXFEED_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: internal-token
            - name: FLUXFEED_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-user
            - name: FLUXFEED_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: mysql-password
            - name: FLUXFEED_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: redis-password
            - name: FLUXFEED_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fluxfeed-secrets
                  key: rabbitmq-url
          volumeMounts:
            - name: api-config
              mountPath: /app/configs/config.yaml
              subPath: api-config.yaml
              readOnly: true
      volumes:
        - name: api-config
          configMap:
            name: fluxfeed-config
            items:
              - key: api-config.yaml
                path: api-config.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fluxfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: fluxfeed-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fluxfeed
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
