services:
  mysql:
    image: mysql:8.4
    container_name: fluxfeed-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: FluxFeed
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    # ports:
    #   - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: fluxfeed-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fluxfeed-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 30s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: fluxfeed-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fluxfeed-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./api/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - api_uploads:/app/uploads
    environment:
      FLUXFEED_ENV: development
      FLUXFEED_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FLUXFEED_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      ADMIN: ${ADMIN:?set ADMIN in .env}
      ADMIN_PW: ${ADMIN_PW:?set ADMIN_PW in .env}
      FLUXFEED_DATABASE_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      FLUXFEED_DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      FLUXFEED_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      FLUXFEED_RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      FLUXFEED_PUBLIC_URL: ${FLUXFEED_PUBLIC_URL:-http://localhost:5173}
      FLUXFEED_SMTP_HOST: ${FLUXFEED_SMTP_HOST:-}
      FLUXFEED_SMTP_PORT: ${FLUXFEED_SMTP_PORT:-587}
      FLUXFEED_SMTP_USERNAME: ${FLUXFEED_SMTP_USERNAME:-}
      FLUXFEED_SMTP_PASSWORD: ${FLUXFEED_SMTP_PASSWORD:-}
      FLUXFEED_SMTP_FROM: ${FLUXFEED_SMTP_FROM:-}
      FLUXFEED_SMTP_TLS_MODE: ${FLUXFEED_SMTP_TLS_MODE:-starttls}
      FLUXFEED_GOOGLE_CLIENT_ID: ${FLUXFEED_GOOGLE_CLIENT_ID:-}
      FLUXFEED_GOOGLE_CLIENT_SECRET: ${FLUXFEED_GOOGLE_CLIENT_SECRET:-}
      FLUXFEED_GITHUB_CLIENT_ID: ${FLUXFEED_GITHUB_CLIENT_ID:-}
      FLUXFEED_GITHUB_CLIENT_SECRET: ${FLUXFEED_GITHUB_CLIENT_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fluxfeed-worker
    command: ["./fluxfeed-worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    volumes:
      - ./api/configs/config.docker.yaml:/app/configs/config.yaml:ro
    environment:
      FLUXFEED_ENV: development
      FLUXFEED_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FLUXFEED_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      FLUXFEED_DATABASE_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      FLUXFEED_DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      FLUXFEED_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      FLUXFEED_RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fluxfeed-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fluxfeed-prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  tempo:
    image: grafana/tempo:3.0.3
    container_name: fluxfeed-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fluxfeed-grafana
    depends_on:
      - prometheus
      - tempo
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  api_uploads:
  prometheus_data:
  grafana_data:
  tempo_data:
