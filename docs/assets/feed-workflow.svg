<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
  <title>FluxFeed / Feed Workflow</title>
  <desc>Request path from a feed scene to candidates, filters, ranking, assembly and feedback events.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
  <style>text{font-family:DejaVu Sans,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#172033}.sub{font-size:14px;fill:#64748b}.label{font-size:17px;font-weight:700;fill:#172033}.detail{font-size:13px;fill:#526176}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1200" height="520" rx="20" fill="#f7f9fc"/>
  <text x="40" y="54" class="title">FluxFeed / Feed Workflow</text><text x="40" y="82" class="sub">Scene routing, candidate processing, cache-aware assembly and behavior feedback</text>
  <rect x="40" y="125" width="185" height="90" rx="12" fill="#edf5ff" stroke="#5b8ed8"/><text x="60" y="158" class="label">Feed Request</text><text x="60" y="184" class="detail">scene · cursor · limit</text><path class="edge" d="M225 170 H265"/>
  <rect x="265" y="125" width="185" height="90" rx="12" fill="#ecf8f3" stroke="#59a78c"/><text x="285" y="158" class="label">FeedRouter</text><text x="285" y="184" class="detail">select strategy</text><path class="edge" d="M450 170 H490"/>
  <rect x="490" y="110" width="220" height="120" rx="12" fill="#f3efff" stroke="#9b80cf"/><text x="510" y="143" class="label">FeedStrategy</text><text x="510" y="169" class="detail">Timeline · Hot</text><text x="510" y="191" class="detail">Following · Recommend</text><text x="510" y="213" class="detail">cache / repository / recall</text><path class="edge" d="M710 170 H750"/>
  <rect x="750" y="125" width="185" height="90" rx="12" fill="#ecf8f3" stroke="#59a78c"/><text x="770" y="158" class="label">Candidate Pipeline</text><text x="770" y="184" class="detail">dedupe → filter → rank</text><path class="edge" d="M935 170 H975"/>
  <rect x="975" y="125" width="185" height="90" rx="12" fill="#edf5ff" stroke="#5b8ed8"/><text x="995" y="158" class="label">FeedAssembler</text><text x="995" y="184" class="detail">card · stat · viewer action</text>
  <rect x="750" y="295" width="185" height="90" rx="12" fill="#fff6e7" stroke="#d9a148"/><text x="770" y="328" class="label">Feed Result</text><text x="770" y="354" class="detail">items · next cursor</text><path class="edge" d="M1068 215 V255 H843 V295"/>
  <rect x="490" y="295" width="220" height="90" rx="12" fill="#f3efff" stroke="#9b80cf"/><text x="510" y="328" class="label">User Behavior</text><text x="510" y="354" class="detail">view · like · favorite · comment</text><path class="edge" d="M750 340 H710"/>
  <rect x="265" y="295" width="185" height="90" rx="12" fill="#ecf8f3" stroke="#59a78c"/><text x="285" y="328" class="label">Event Bus</text><text x="285" y="354" class="detail">Outbox → Kafka</text><path class="edge" d="M490 340 H450"/>
  <rect x="40" y="295" width="185" height="90" rx="12" fill="#edf5ff" stroke="#5b8ed8"/><text x="60" y="328" class="label">Async Updates</text><text x="60" y="354" class="detail">counter · feature · fan-out</text><path class="edge" d="M265 340 H225"/><path class="edge" d="M132 295 V255 H600 V230"/>
  <text x="40" y="474" class="sub">Behavior signals return through asynchronous workers and influence later feed requests.</text>
</svg>
